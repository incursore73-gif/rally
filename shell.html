<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Alpine Drift 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&display=swap"><style>
:root{--bg:#0e1210;--fg:#eef1ea;--mut:#98a28f;--red:#e8200f;--card:#1a211a;--line:#2e3a2e;--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:calc(8px + var(--sat));left:calc(14px + var(--sal));pointer-events:none;line-height:1.05;text-shadow:0 1px 4px #000}
#pos{font-size:44px;font-weight:700;min-height:46px}#pos small{font-size:20px;color:#cfd5c8}
#lap{font-size:20px;font-weight:600}#tm{font-size:26px;font-variant-numeric:tabular-nums;font-weight:600}
#rec{font-size:19px;font-weight:600;color:#ffd84d;font-variant-numeric:tabular-nums;margin-top:2px}
#sect{display:flex;gap:4px;margin-top:5px}
#sect .c{position:relative;width:72px;height:26px;border-radius:5px;background:rgba(10,16,10,.6);overflow:hidden;font:600 15px/24px "Barlow Condensed","Arial Narrow",sans-serif;text-align:center;font-variant-numeric:tabular-nums;color:#fff;border:1px solid rgba(255,255,255,.25)}
#sect .c i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.22)}
#sect .c b{position:relative;font-weight:600}
#sect .c.cur{border-color:#fff}
#sect .c.y{background:#d9a900;border-color:#ffe066;color:#111}
#sect .c.p{background:#9b2fe0;border-color:#d48bff;box-shadow:0 0 10px #b84dff}
#sect .c.glow{animation:gl .45s ease-in-out 8 alternate}
@keyframes gl{from{box-shadow:0 0 6px #b84dff}to{box-shadow:0 0 26px 6px #d48bff}}
#tm.pu{color:#d48bff;text-shadow:0 0 12px #b84dff}
#mm{position:fixed;top:calc(8px + var(--sat));right:calc(14px + var(--sar));width:190px;height:190px;pointer-events:none;border-radius:12px;background:rgba(10,16,10,.55);border:1px solid rgba(255,255,255,.25)}
#note{position:fixed;top:calc(54px + var(--sat));left:50%;transform:translateX(-50%);background:rgba(10,16,10,.72);border:2px solid #fff;border-radius:12px;padding:4px 16px;font-size:28px;font-weight:700;white-space:nowrap;pointer-events:none;display:flex;gap:10px;align-items:center}
#note small{font-size:18px;font-weight:600;color:#cfd5c8}
#note.h{border-color:#ff4a2a;color:#ffb09a}
#spdw{position:fixed;bottom:calc(10px + var(--sab));left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 1px 4px #000}
#spd{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
#revw{width:220px;height:10px;margin:2px auto 0;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden}#rev{height:100%;width:0;border-radius:5px}
#msg{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:clamp(48px,18vh,120px);font-weight:700;pointer-events:none;text-shadow:0 3px 14px #000}
#msg.gm{font-size:30px;top:26%;color:#ff5a4a}#msg.gm.ok{color:#3ddc84}
#snd{position:fixed;top:calc(8px + var(--sat));left:50%;margin-left:-20px;width:40px;height:40px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:rgba(10,16,10,.5);font-size:18px;z-index:3}
#pedals{position:fixed;left:calc(14px + var(--sal));bottom:calc(14px + var(--sab));width:260px;height:62%;display:flex;flex-direction:row;gap:10px}
#pedals button{border:2px solid rgba(255,255,255,.35);border-radius:16px;color:#fff;font:600 20px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;background:rgba(10,16,10,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#gas{flex:1.25;border-color:rgba(60,220,120,.6)!important}
#hb{flex:1;border-color:rgba(255,190,40,.8)!important}
#pedals button.on{background:rgba(255,255,255,.35)}
#fs{position:fixed;top:calc(8px + var(--sat));left:50%;margin-left:28px;width:40px;height:40px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:rgba(10,16,10,.5);color:#fff;font-size:18px;z-index:3}
#wz{position:fixed;right:0;top:0;bottom:0;width:44%}
#wheel{position:absolute;right:calc(34px + var(--sar));bottom:calc(14px + var(--sab));width:min(210px,52vh);height:min(210px,52vh);border-radius:50%;border:14px solid rgba(255,255,255,.55);background:rgba(10,16,10,.4)}
#wheel::before{content:"";position:absolute;left:50%;top:50%;width:74%;height:12px;margin:-6px 0 0 -37%;background:rgba(255,255,255,.55);border-radius:6px}
#wheel::after{content:"";position:absolute;left:50%;top:-12px;width:10px;height:22px;margin-left:-5px;background:var(--red);border-radius:3px}
.ov{position:fixed;inset:0;background:rgba(8,12,8,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(12px + var(--sat)) calc(16px + var(--sar)) calc(12px + var(--sab)) calc(16px + var(--sal));z-index:5;overflow:auto;touch-action:pan-y}
.ov *{touch-action:pan-y}
.hide{display:none!important}
h1{margin:0;font-size:clamp(34px,9vh,56px);line-height:1}h1 b{color:#ff8a1a}
.sub{color:var(--mut);font-size:18px;margin:0}
.btn{background:#e8590c;border:0;color:#fff;border-radius:10px;padding:10px 20px;font:700 22px "Barlow Condensed","Arial Narrow",sans-serif}
.btn.g{background:var(--card);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#res .big{font-size:60px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#res table{border-collapse:collapse;font-size:20px;font-variant-numeric:tabular-nums}
#res td{padding:1px 12px;color:#cfd5c8}

@media (orientation:portrait){#rot{display:flex}}
canvas#c{display:none}canvas#gl{position:fixed;inset:0;width:100%;height:100%}#ld{position:fixed;inset:0;z-index:50;background:#0b0f14;color:#f3f5f7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:600 15px system-ui,sans-serif}
#ld b{font-size:26px;letter-spacing:.04em}#ldbar{width:min(300px,70vw);height:8px;border-radius:4px;background:#ffffff22;overflow:hidden}#ldb{height:100%;width:0;background:#ff6a1a;transition:width .2s}

/* ===== menu prove: stile sportivo ===== */
#menu{justify-content:flex-start;gap:7px;padding-top:calc(9px + var(--sat));padding-bottom:calc(16px + var(--sab));background:linear-gradient(112deg,rgba(232,32,15,.20) 0 15%,transparent 15% 100%),repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 2px,transparent 2px 7px),radial-gradient(120% 90% at 18% -10%,#1f2d25 0,#0b100d 58%,#060908 100%)}
#menu::after{content:"";position:fixed;left:0;right:0;bottom:0;height:10px;background:repeating-conic-gradient(#f4f4f4 0 25%,#101410 0 50%) 0 0/20px 20px;opacity:.9;pointer-events:none}
.mh,#lv,.mfo{width:100%;max-width:1060px;flex:none}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:baseline;gap:7px;font-style:italic;font-weight:800;line-height:.92;text-transform:uppercase;transform:skewX(-9deg);padding-left:6px;white-space:nowrap}
.lg1,.lg2{font-size:clamp(30px,9vh,44px);letter-spacing:.015em}.lg1{color:#fff}.lg2{color:#ff6a1a}
.logo small{font-size:13px;font-weight:700;letter-spacing:.3em;color:var(--mut);margin-left:6px;align-self:flex-end;padding-bottom:3px}
.mhr{display:flex;align-items:center;gap:14px}
#mst{display:flex;gap:9px;font-size:15px;font-weight:700;color:#aeb8a6;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}#mst b{color:#fff;font-size:19px;font-style:italic}
.btn.go{position:relative;font-style:italic;font-weight:800;font-size:24px;line-height:1;letter-spacing:.05em;text-transform:uppercase;padding:9px 30px 9px 26px;border-radius:0;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);background:linear-gradient(180deg,#ff7d1a,#e8200f);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);white-space:nowrap}
.btn.go small{display:block;margin-top:2px;font-size:12px;font-weight:700;letter-spacing:.2em;opacity:.9}
.btn.go:active{filter:brightness(1.15)}
#lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:7px}
.lvb{--a:#9fb2c2;position:relative;display:block;min-width:0;padding:0;border:0;background:none;color:var(--fg);text-align:left;font-family:inherit;cursor:pointer;animation:cin .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*32ms)}
.lvb.g{--a:#ffa72e}
@keyframes cin{from{opacity:0;transform:translateX(-14px) skewX(-6deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lvb{animation:none}}
.cin{position:relative;height:122px;padding:7px 8px 6px 11px;overflow:hidden;background:linear-gradient(155deg,#1d271f 0,#121813 70%);border:1px solid #2d3a2e;border-left:5px solid var(--a);clip-path:polygon(0 0,calc(100% - 15px) 0,100% 15px,100% 100%,0 100%);transition:filter .12s}
.lvb:active .cin,.lvb:hover .cin{filter:brightness(1.22);border-color:#ff6a1a}
.ct{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.no{font-size:23px;font-weight:800;font-style:italic;line-height:1;color:var(--a);letter-spacing:.02em}
.wx{font-size:13px;font-weight:600;color:#c8d0c0;white-space:nowrap;padding-right:13px}
.nm{position:relative;z-index:1;display:block;font-size:20px;font-weight:700;line-height:1.08;letter-spacing:.01em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{position:relative;z-index:1;display:block;font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin-top:1px;white-space:nowrap;overflow:hidden;max-width:calc(100% - 56px)}.mt b{color:var(--a);font-weight:700}
.df{position:relative;z-index:1;display:flex;gap:3px;margin-top:5px}.df i{width:10px;height:8px;background:#2b362c;transform:skewX(-24deg)}.df i.on{background:var(--a)}
.rc{position:absolute;left:11px;bottom:6px;z-index:1;display:flex;align-items:center;gap:5px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.mt.nk .km{display:none}.tm{color:#ffd84d}.md{font-size:17px}.nr{font-size:15px;font-weight:600;letter-spacing:.06em;color:#566253}
.mp{position:absolute;right:6px;bottom:5px;width:58px;height:58px;pointer-events:none}
.mp polyline{fill:none;stroke-linejoin:round;stroke-linecap:round}.m1{stroke:#000;stroke-opacity:.6;stroke-width:8}.m2{stroke:var(--a);stroke-width:3.4}
.cs{fill:#3ddc84;stroke:#0b100d;stroke-width:2.5}.cf{fill:#fff;stroke:#0b100d;stroke-width:2.5}
.mfo{display:flex;justify-content:space-between;align-items:center;gap:10px}
#menu .mfo .btn.g{font-size:15px;font-weight:600;padding:6px 12px;white-space:nowrap;letter-spacing:.03em}
.tip{color:#7f8b78;font-size:13px;letter-spacing:.05em;text-transform:uppercase;text-align:right}
@media (max-width:900px){#lv{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.logo small{display:none}.mh{gap:8px}#mst{font-size:13px;gap:6px}#mst b{font-size:16px}.btn.go{font-size:20px;padding:7px 22px 7px 20px}.btn.go small{font-size:10.5px}.cin{padding:6px 6px 5px 9px}.no{font-size:21px}.wx{font-size:12px;padding-right:12px}.nm{font-size:17px}.mt{font-size:12px;letter-spacing:.04em}.rc{left:9px;font-size:16px}.mp{width:44px;height:44px}.mt{max-width:calc(100% - 42px)}}
@media (max-width:700px){.mt .km{display:none}.mp{top:46px;bottom:auto;right:5px;width:38px;height:38px}.mt{max-width:calc(100% - 46px)}.rc{font-size:15px}}
@media (max-height:400px){#menu{gap:5px;padding-top:calc(5px + var(--sat))}.cin{height:98px}.df{margin-top:3px}.rc{bottom:5px}.lg1,.lg2{font-size:30px}.tip{font-size:12px}}

/* ===== impostazioni nel menu, parte alta della partita libera ===== */
#snd,#fs{display:none!important}
.btn.set{display:flex;align-items:center;gap:8px;font-style:italic;font-weight:800;font-size:20px;letter-spacing:.05em;text-transform:uppercase;line-height:1;padding:9px 20px 9px 16px;border-radius:0;border:2px solid #ff6a1a;background:linear-gradient(180deg,#2a3629,#161e17);color:#fff;transform:skewX(-10deg);white-space:nowrap}
.btn.set>span{display:block;transform:skewX(10deg)}.btn.set .gi{font-size:24px;color:#ff6a1a;font-style:normal}
.btn.set:active{filter:brightness(1.25)}
#menu .mfo{gap:12px}#menu .mfo #mst{flex:1;justify-content:center}
#cfgp{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:calc(10px + var(--sat)) calc(14px + var(--sar)) calc(14px + var(--sab)) calc(14px + var(--sal));background:linear-gradient(112deg,rgba(232,32,15,.18) 0 12%,transparent 12% 100%),repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 2px,transparent 2px 7px),radial-gradient(120% 90% at 18% -10%,#1f2d25 0,#0b100d 58%,#060908 100%);color:#fff;font:600 16px "Barlow Condensed",system-ui,sans-serif;overflow:auto}
#cfgp .sw{width:100%;max-width:880px;max-height:100%;display:flex;flex-direction:column;gap:10px}
#cfgp .sh{display:flex;align-items:center;justify-content:space-between}
#cfgp .stt{font-size:34px;font-weight:800;font-style:italic;text-transform:uppercase;transform:skewX(-9deg);letter-spacing:.02em}
#cfgp .btn.go{font-size:20px;padding:8px 26px 8px 22px}
#cfgp .sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#cfgp section{background:linear-gradient(155deg,#1d271f,#121813 70%);border:1px solid #2d3a2e;border-left:5px solid #ff6a1a;padding:8px 12px 10px;display:flex;flex-direction:column;gap:8px}
#cfgp h3{margin:0;font-size:16px;font-style:italic;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ff6a1a}
#cfgp label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:18px}
#cfgp label.rg{flex-direction:column;align-items:stretch;gap:3px}
#cfgp input[type=checkbox]{width:24px;height:24px;accent-color:#ff6a1a}
#cfgp input[type=range]{width:100%;accent-color:#ff6a1a}
#cfgp select{font:600 17px "Barlow Condensed",system-ui,sans-serif;background:#0e140f;color:#fff;border:1px solid #3a4a3b;border-radius:6px;padding:5px 8px;min-width:130px}
#cfgp small{font-size:14px;color:#7f8b78;letter-spacing:.03em}
#cfgp .btn.g{font-size:17px;padding:7px 12px;align-self:flex-start}
@media (max-width:900px){#menu .mfo .tip{display:none}.btn.set{font-size:17px;padding:8px 14px 8px 12px}.btn.set .gi{font-size:20px}}
@media (max-height:430px){#cfgp{padding-top:calc(6px + var(--sat));padding-bottom:calc(8px + var(--sab))}#cfgp .stt{font-size:28px}#cfgp .btn.go{font-size:18px;padding:6px 22px 6px 18px}#cfgp section{padding:5px 10px 7px;gap:4px}#cfgp h3{font-size:14px}#cfgp label{font-size:16px}#cfgp input[type=checkbox]{width:21px;height:21px}#cfgp select{padding:2px 8px;font-size:16px}#cfgp .sw{gap:6px}#cfgp .sg{gap:6px}#cfgp .btn.g{padding:5px 10px;font-size:16px}#cfgp small{font-size:12px}}
@media (max-width:640px){#cfgp .sg{grid-template-columns:1fr}}

/* ===== schermata "ruota il telefono" ===== */
#rot{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(18px + var(--sat)) 22px calc(34px + var(--sab));text-align:center;color:#fff;font-family:"Barlow Condensed",system-ui,sans-serif;overflow:hidden;background:linear-gradient(160deg,rgba(232,32,15,.24) 0 20%,transparent 20% 100%),repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 2px,transparent 2px 7px),radial-gradient(110% 70% at 50% 40%,#233229 0,#0b100d 62%,#050806 100%)}
@media (orientation:portrait){#rot{display:flex}}
#rot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-conic-gradient(#f4f4f4 0 25%,#101410 0 50%) 0 0/20px 20px;opacity:.9}
.rt-st{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.rt-st i{position:absolute;left:-40%;height:2px;width:60%;background:linear-gradient(90deg,transparent,rgba(255,106,26,.6),transparent);animation:rtS 2.8s linear infinite;opacity:0}
@keyframes rtS{from{transform:translateX(0);opacity:0}15%{opacity:1}to{transform:translateX(300%);opacity:0}}
.rt-logo{position:relative;font-style:italic;font-weight:800;text-transform:uppercase;font-size:46px;line-height:1;transform:skewX(-9deg);letter-spacing:.015em;margin-bottom:34px}.rt-logo b{color:#ff6a1a}
.rt-ph{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.rt-arr{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 8px rgba(255,106,26,.5))}
.rt-ph .ph{position:relative;width:76px;height:134px;border:5px solid #f4f4f4;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#27475e 0 42%,#1d2b21 42% 100%);box-shadow:0 0 30px rgba(255,106,26,.38);animation:rtP 3.6s cubic-bezier(.65,0,.3,1) infinite}
.rt-ph .ph::before{content:"";position:absolute;top:5px;left:50%;width:22px;height:5px;border-radius:3px;background:#f4f4f4;transform:translateX(-50%);z-index:2}
.rt-ph .rd{position:absolute;left:0;right:0;bottom:0;height:58%;background:#41524a;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.rt-ph .rd::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:repeating-linear-gradient(180deg,#ffa72e 0 10px,transparent 10px 20px)}
@keyframes rtP{0%,16%{transform:rotate(0)}46%,74%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
.rt-t{position:relative;font-size:44px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.02em;line-height:1;transform:skewX(-8deg)}
.rt-s{position:relative;margin-top:10px;font-size:22px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#aeb8a6}
.rt-m{position:relative;margin-top:38px;display:flex;align-items:center;gap:12px;padding:10px 22px 10px 18px;border:2px solid rgba(255,106,26,.75);background:rgba(10,16,10,.6);border-radius:999px;font-size:19px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.eq{display:flex;align-items:flex-end;gap:3px;height:22px}.eq i{width:4px;height:7px;background:#ff6a1a;border-radius:2px}
.mus .eq i{animation:rtE .8s ease-in-out infinite alternate}.mus .eq i:nth-child(2){animation-delay:-.25s}.mus .eq i:nth-child(3){animation-delay:-.5s}.mus .eq i:nth-child(4){animation-delay:-.15s}.mus .eq i:nth-child(5){animation-delay:-.4s}
@keyframes rtE{from{height:5px}to{height:22px}}
.rt-m .on{display:none}.mus .rt-m .on{display:inline}.mus .rt-m .off{display:none}
@media (max-height:700px){.rt-logo{font-size:38px;margin-bottom:20px}.rt-ph{width:150px;height:150px;margin-bottom:16px}.rt-t{font-size:38px}.rt-m{margin-top:24px}}
@media (prefers-reduced-motion:reduce){.rt-st i,.rt-ph .ph,.mus .eq i{animation:none}}
.inrace .rt-m{display:none}
#fpsb{position:fixed;top:calc(4px + var(--sat));left:50%;transform:translateX(-50%);z-index:8;display:none;pointer-events:none;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#9dff9d;font:600 13px/1.2 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.04em;white-space:nowrap}

/* ===== schermata risultati: stile sportivo ===== */

.rs{width:100%;max-width:900px;display:flex;flex-direction:column;gap:6px;margin:auto}

.rs-sec .p{border-color:#d48bff;color:#d48bff}.rs-sec .y{border-color:#f2c200;color:#f2c200}
.rs-md{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rs-mm{font-size:46px;line-height:1;animation:rsPop .6s .2s cubic-bezier(.2,1.4,.4,1) both}.rs-mm.off{opacity:.35;filter:grayscale(1)}
.rs-mc{padding:3px 11px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;background:#141c16;border:1px solid #2d3a2e;border-radius:4px;color:#6c7867}
.rs-mc.on{border-color:#ffd84d;color:#ffd84d;background:#262210}
.rs-fall{font-size:17px;font-weight:600;color:#ff5a4a;letter-spacing:.04em;text-transform:uppercase}.rs-fall b{font-size:20px}
.rs-end{margin-top:2px;padding:6px 14px;font-size:22px;font-weight:700;color:#ffd84d;background:rgba(255,216,77,.1);border-left:5px solid #ffd84d}.rs-end b{font-style:italic;font-size:26px}
.rs-r{display:flex;flex-direction:column;gap:8px}
.rs-r .btn{width:100%;margin:0}
.rs-r .btn.go{font-size:24px;padding:11px 24px}
.rs-r .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rs-r .row2 .btn{font-size:18px;padding:8px 6px}
@keyframes rsIn{from{opacity:0;transform:translateX(-22px) skewX(-8deg)}to{opacity:1;transform:skewX(-8deg)}}
@keyframes rsPop{from{opacity:0;transform:scale(.2) rotate(-25deg)}to{opacity:1;transform:none}}
